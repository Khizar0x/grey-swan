<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Swan</title>
    <script>
      // Matches ThemeContext.tsx's storage key — runs before first paint so
      // a returning dark-mode visitor never sees a flash of the light theme
      // while React mounts.
      ;(function () {
        try {
          if (localStorage.getItem('greyswan_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
